name: Publish QOLLOCK update marker

on:
  workflow_dispatch:
    inputs:
      marker:
        description: Next whole-number QOL_UPDATE_MARKER (for example 2)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Publish marker and retire previous releases
        run: python tools/publish_marker.py "${{ inputs.marker }}"
      - name: Validate generated markers
        run: python tools/test_markers.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md markers
          git commit -m "release: publish marker ${{ inputs.marker }}"
          git push
